<!-- @dsCard group="Layout" height=640 width=1100 subtitle="Sign-in landing before the Cognito redirect" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><style>body{padding:0}</style></head>
<body>
<main class="mcg-login" style="min-height:640px">
<div class="mcg-login__main">
<div class="mcg-login__bar">
<div class="mcg-topbar__brand"><span class="mcg-topbar__mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>myClaimGrid</div>
<div class="mcg-row">
<div class="mcg-seg mcg-seg--sm" role="group" aria-label="Sprache"><button aria-pressed="true">DE</button><button aria-pressed="false">EN</button></div>
<div class="mcg-seg mcg-seg--sm" role="group" aria-label="Darstellung"><button aria-pressed="false" aria-label="Hell"><svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 6.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zM10 2v2M10 16v2M2 10h2M16 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M4.3 15.7l1.4-1.4M14.3 5.7l1.4-1.4"/></svg></button><button aria-pressed="true" aria-label="System"><svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.75 3.75h14.5v10H2.75zM7 17.25h6M10 13.75v3.5"/></svg></button><button aria-pressed="false" aria-label="Dunkel"><svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" viewBox="0 0 20 20" aria-hidden="true"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z"/></svg></button></div>
</div>
</div>
<div class="mcg-login__body">
<div class="mcg-notice" role="status"><svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.75a7.25 7.25 0 1 0 0 14.5 7.25 7.25 0 0 0 0-14.5zM10 9v5M10 6v.5"/></svg><span>Du wurdest abgemeldet.</span></div>
<h1 class="mcg-login__title">Rechnungen im Blick</h1>
<p class="mcg-login__text">Arzt- und Klinikrechnungen für alle drei Personen erfassen und pro Jahr auswerten.</p>
<div class="mcg-login__actions">
<button class="mcg-btn mcg-btn--primary">Anmelden<svg fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M11 6l4 4-4 4"/></svg></button>
<span class="mcg-login__meta">Die Anmeldung läuft über eine gesicherte Seite von AWS. Danach geht es automatisch zurück.</span>
</div>
</div>
<div class="mcg-login__foot">Zugang nur auf Einladung.</div>
</div>
<div class="mcg-login__art" aria-hidden="true">
<i style="left:96px;top:0;width:240px;height:144px;background:var(--accent)"></i>
<i style="left:336px;top:0;width:96px;height:100%;background:var(--ink)"></i>
<i style="left:0;top:144px;width:96px;height:96px;background:var(--person-1)"></i>
<i style="left:192px;top:144px;width:96px;height:48px;background:var(--person-2)"></i>
<i style="left:288px;top:192px;width:48px;height:48px;background:var(--person-3)"></i>
<i style="left:96px;top:384px;width:144px;height:48px;background:var(--accent-soft)"></i>
</div>
</main>
</body>
</html>
