name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to check. Empty means the triggering commit.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    # No AWS credentials in this job, it also runs for pull requests.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build # includes the production build of the frontend once it exists
      - run: npm run csp:check # the inline theme script hash in infra/ must match the build
      - run: npm run synth

      # End to end tests against a mocked API (only when the frontend exists).
      - name: Install Playwright browsers
        if: hashFiles('frontend/package.json') != ''
        run: npx playwright install --with-deps chromium
      - name: Playwright tests
        if: hashFiles('frontend/package.json') != ''
        run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && hashFiles('frontend/package.json') != ''
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
