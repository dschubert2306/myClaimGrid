name: Deploy

on:
  push:
    branches: [main]
  # Rollback: run this workflow manually with the commit to go back to (see README, "Rollback").
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, tag or branch to deploy. Empty means the latest commit of main.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never cancel a running CloudFormation deployment

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The environment "prod" requires a manual approval and may only deploy from main.
    environment: prod
    permissions:
      id-token: write # OIDC, no long-lived AWS keys
      contents: read
    env:
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      COGNITO_DOMAIN_PREFIX: ${{ vars.COGNITO_DOMAIN_PREFIX }}
    steps:
      - name: Check configuration
        run: |
          test -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" || { echo "::error::Environment variable AWS_DEPLOY_ROLE_ARN is not set"; exit 1; }
          test -n "$ALERT_EMAIL" || { echo "::error::Environment variable ALERT_EMAIL is not set (needed for the budget and the alarm)"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      # The CDK app uploads the frontend build, writes config.json and invalidates CloudFront.
      - name: Deploy all stacks
        working-directory: infra
        run: >
          npx cdk deploy --all --require-approval never
          -c alertEmail="$ALERT_EMAIL"
          ${COGNITO_DOMAIN_PREFIX:+-c cognitoDomainPrefix="$COGNITO_DOMAIN_PREFIX"}
