version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aws-sdk:
        patterns: ['@aws-sdk/*']
      aws-cdk:
        patterns: ['aws-cdk', 'aws-cdk-lib', 'constructs']
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
      lint-and-test:
        patterns:
          ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier', 'vitest', '@playwright/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
