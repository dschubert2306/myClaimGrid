<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>myClaimGrid</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem('mcg.theme');
        } catch (e) {}
        var dark =
          choice === 'dark' ||
          (choice !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <mcg-root></mcg-root>
  </body>
</html>
